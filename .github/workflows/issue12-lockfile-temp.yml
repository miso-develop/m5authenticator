name: Issue 12 lockfile temporary verification

on:
  push:
    branches:
      - feat/issue-12-qr-import

permissions:
  contents: write

jobs:
  lockfile-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Generate exact lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from generated lockfile
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test Web App
        working-directory: web
        run: npm test

      - name: Build Web App
        working-directory: web
        run: npm run build

      - name: Ensure only lockfile changed
        run: git diff --exit-code -- . ':!web/package-lock.json'

      - name: Commit generated lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build(web): refresh QR import lockfile"
          git push origin HEAD:feat/issue-12-qr-import

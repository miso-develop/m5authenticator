name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    name: security:scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Python runtime
        run: python3 --version
      - name: Verify immutable ESP-IDF build image contract
        run: python3 -m unittest tests/esp_idf_image_pin_contract_test.py
      - name: Verify CI supply-chain privilege and workspace boundaries
        run: python3 -m unittest tests/ci_supply_chain_boundary_test.py
      - name: Verify CI change-impact routing and Pages cadence
        run: >-
          python3 -m unittest
          tests/ci_change_impact_test.py
          tests/ci_pages_summary_test.py
      - name: Verify protected-main release authorization
        run: python3 -m unittest tests/release_authorization_test.py
      - name: Verify signed release attestation provenance contract
        run: python3 -m unittest tests/release_attestation_test.py
      - name: Verify V1 release security closeout contract
        run: python3 -m unittest tests/security_closeout_contract_test.py
      - name: Verify automatic lock Protocol-v2 security contract
        run: python3 -m unittest tests/automatic_lock_protocol_contract_test.py
      - name: Verify test-only screen snapshot production boundary
        run: python3 -m unittest tests/screen_snapshot_security_contract_test.py
      - name: Test repository security scanner
        run: python3 -m unittest discover -s tests -p 'test_security_scan.py'
      - name: Scan tracked repository content
        run: python3 scripts/security_scan.py

name: Issue 117 Screen Snapshot

on:
  pull_request:
    paths:
      - "firmware/CMakeLists.txt"
      - "firmware/sdkconfig.defaults"
      - "firmware/main/**"
      - "firmware/components/m5auth_device_sticks3/**"
      - "firmware/components/m5auth_time/**"
      - "firmware/components/m5auth_session/**"
      - "firmware/components/m5auth_vault_runtime/**"
      - "tests/screen_snapshot_*"
      - "tests/esp_idf_image_pin_contract_test.py"
      - "scripts/esp_idf_build_image.py"
      - "scripts/ci_change_impact.py"
      - "tools/diagnostics/screen_snapshot.py"
      - "scripts/windows/**"
      - "docs/testing/screen-snapshot-diagnostics.md"
      - "docs/testing/screen-snapshot-usb-tx-investigation.md"
      - "AGENTS.md"
      - ".github/workflows/issue117-screen-snapshot.yml"

permissions:
  contents: read

jobs:
  classify:
    name: classify snapshot impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      snapshot_contract: ${{ steps.impact.outputs.snapshot_contract }}
      snapshot_build: ${{ steps.impact.outputs.snapshot_build }}
      uncertain: ${{ steps.impact.outputs.uncertain }}
    steps:
      - name: Checkout complete history for deterministic diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify snapshot impact fail-safe
        id: impact
        run: >-
          python3 scripts/ci_change_impact.py
          --event-file "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
          --github-output "$GITHUB_OUTPUT"

  snapshot-contract:
    name: snapshot contract
    needs: classify
    if: needs.classify.outputs.snapshot_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test sanitized snapshot contracts
        run: >-
          python3 -m unittest
          tests/screen_snapshot_runtime_contract_test.py
          tests/screen_snapshot_security_contract_test.py
          tests/screen_snapshot_host_helper_test.py
          tests/screen_snapshot_framing_test.py
          tests/screen_snapshot_contamination_test.py
          tests/screen_snapshot_pre_request_sync_test.py
          tests/screen_snapshot_request_relation_test.py
          tests/screen_snapshot_request_path_contract_test.py
          tests/screen_snapshot_usb_tx_boundary_test.py
          tests/screen_snapshot_tx_atomicity_test.py
          tests/screen_snapshot_usage_contract_test.py
          tests/screen_snapshot_windows_scripts_contract_test.py

  snapshot-build:
    name: test-only screen snapshot profile
    needs: classify
    if: needs.classify.outputs.snapshot_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable ESP-IDF build image contract
        run: python3 -m unittest tests/esp_idf_image_pin_contract_test.py
      - name: Build diagnostics-ON profile with ESP-IDF 5.5.5
        run: >-
          ESP_IDF_IMAGE="$(python scripts/esp_idf_build_image.py --reference)"
          && docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware
          "$ESP_IDF_IMAGE"
          bash -lc 'git config --global --add safe.directory /project && idf.py -B build-screen-snapshot set-target esp32s3 && idf.py -B build-screen-snapshot -DM5AUTH_TEST_SCREEN_SNAPSHOT=ON build && grep -Fx "M5AUTH_TEST_SCREEN_SNAPSHOT:BOOL=ON" build-screen-snapshot/CMakeCache.txt'
      - name: Verify dependency lockfile is unchanged
        run: git diff --exit-code -- firmware/dependencies.lock

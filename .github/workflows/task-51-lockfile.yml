name: Task 51 lockfile

on:
  push:
    branches:
      - task/51

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Pin bundled Argon2id dependency
        working-directory: web
        run: npm install --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund hash-wasm@4.12.0
      - name: Commit lockfiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/package.json web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: pin hash-wasm 4.12.0"
          git push

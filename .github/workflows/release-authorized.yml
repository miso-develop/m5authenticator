name: Authorized Release

on:
  repository_dispatch:
    types:
      - publish_semver_release

permissions:
  contents: read

jobs:
  authorize:
    name: authorize-protected-main-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      statuses: read
      actions: read
    outputs:
      requested-tag: ${{ steps.authorize.outputs.requested-tag }}
      source-sha: ${{ steps.authorize.outputs.source-sha }}
      recovery-mode: ${{ steps.authorize.outputs.recovery-mode }}
    steps:
      - name: Checkout default-branch release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require production release profile
        run: python scripts/validate_release.py --require-production
      - name: Authorize dispatch request, protected main, tag, checks, and optional incident recovery
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.tag }}
          RECOVERY_ID: ${{ github.event.client_payload.recovery_id }}
          APPROVED_RECOVERY_ID: v1.0.0-authorized-release-shell-repair
          APPROVED_RECOVERY_SOURCE_SHA: 996378b07d8587c0d11e43362590e5d1062ad8c2
          APPROVED_FAILED_RUN_ID: "35454271560"
        run: |
          set -euo pipefail

          FIRMWARE_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('firmware/release-profile.json').read_text(encoding='utf-8'))['firmware_version'])
          PY
          )"

          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Default-branch workflow source $GITHUB_SHA is not exact current main $MAIN_SHA"
            exit 1
          fi

          git fetch --force --no-tags origin \
            "refs/tags/$REQUESTED_TAG:refs/tags/$REQUESTED_TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \
            > "$RUNNER_TEMP/main-rules.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/commits/$MAIN_SHA/check-runs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/main-check-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/$GITHUB_REPOSITORY/commits/$MAIN_SHA/status" \
            > "$RUNNER_TEMP/main-statuses.json"

          RECOVERY_ARGS=()
          if [ -n "$RECOVERY_ID" ]; then
            if [ "$RECOVERY_ID" != "$APPROVED_RECOVERY_ID" ]; then
              echo "Recovery ID is not the approved v1.0.0 incident"
              exit 1
            fi
            if [ "$REQUESTED_TAG" != "v1.0.0" ]; then
              echo "Recovery is authorized only for v1.0.0"
              exit 1
            fi

            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/commits/$APPROVED_RECOVERY_SOURCE_SHA/check-runs?filter=latest&per_page=100" \
              > "$RUNNER_TEMP/source-check-runs.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/commits/$APPROVED_RECOVERY_SOURCE_SHA/status" \
              > "$RUNNER_TEMP/source-statuses.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_FAILED_RUN_ID" \
              > "$RUNNER_TEMP/failed-run.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_FAILED_RUN_ID/jobs?per_page=100" \
              > "$RUNNER_TEMP/failed-run-jobs.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" \
              > "$RUNNER_TEMP/rulesets.json"

            IMMUTABILITY_RULESET_ID="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rulesets.json").read_text(encoding="utf-8"))
          matches = [
              item for item in payload
              if isinstance(item, dict)
              and item.get("name") == "SemVer tag immutability"
              and item.get("target") == "tag"
              and item.get("enforcement") == "active"
          ]
          if len(matches) != 1 or not isinstance(matches[0].get("id"), int):
              raise SystemExit("exact active SemVer tag immutability Ruleset was not found")
          print(matches[0]["id"])
          PY
            )"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/rulesets/$IMMUTABILITY_RULESET_ID" \
              > "$RUNNER_TEMP/tag-immutability-ruleset.json"

            RELEASE_STATE=absent
            if gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/$GITHUB_REPOSITORY/releases/tags/$REQUESTED_TAG" \
              > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/existing-release.err"; then
              RELEASE_STATE=present
            elif ! grep -q "HTTP 404" "$RUNNER_TEMP/existing-release.err"; then
              cat "$RUNNER_TEMP/existing-release.err"
              echo "Could not prove GitHub Release absence"
              exit 1
            fi

            RECOVERY_ARGS=(
              --recovery-id "$RECOVERY_ID"
              --recovery-manifest ".github/release-recovery.json"
              --source-check-runs "$RUNNER_TEMP/source-check-runs.json"
              --source-statuses "$RUNNER_TEMP/source-statuses.json"
              --failed-run "$RUNNER_TEMP/failed-run.json"
              --failed-run-jobs "$RUNNER_TEMP/failed-run-jobs.json"
              --tag-immutability-ruleset "$RUNNER_TEMP/tag-immutability-ruleset.json"
              --release-state "$RELEASE_STATE"
              --legacy-workflow ".github/workflows/release.yml"
            )
          fi

          python scripts/release_authorization.py \
            --workflow-sha "$GITHUB_SHA" \
            --main-sha "$MAIN_SHA" \
            --requested-tag "$REQUESTED_TAG" \
            --firmware-version "$FIRMWARE_VERSION" \
            --tag-sha "$TAG_SHA" \
            --main-rules "$RUNNER_TEMP/main-rules.json" \
            --main-check-runs "$RUNNER_TEMP/main-check-runs.json" \
            --main-statuses "$RUNNER_TEMP/main-statuses.json" \
            "${RECOVERY_ARGS[@]}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

          if [ -n "$RECOVERY_ID" ]; then
            SOURCE_SHA="$(sed -n 's/^source-sha=//p' "$GITHUB_OUTPUT" | tail -n 1)"
            if [ "$SOURCE_SHA" != "$APPROVED_RECOVERY_SOURCE_SHA" ]; then
              echo "Authorized recovery source output mismatch"
              exit 1
            fi
            RECOVERY_SOURCE_ROOT="$RUNNER_TEMP/recovery-source"
            git worktree add --detach "$RECOVERY_SOURCE_ROOT" "$SOURCE_SHA"
            python "$RECOVERY_SOURCE_ROOT/scripts/validate_release.py" --require-production
            git worktree remove --force "$RECOVERY_SOURCE_ROOT"
          fi

  build:
    name: build-firmware-unprivileged
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}
    steps:
      - name: Checkout authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.source-sha }}
      - name: Require production release profile
        run: python scripts/validate_release.py --require-production
      - name: Verify immutable ESP-IDF build image contract
        run: python -m unittest tests/esp_idf_image_pin_contract_test.py
      - name: Verify CI supply-chain privilege and workspace boundaries
        run: python -m unittest tests/ci_supply_chain_boundary_test.py
      - name: Build in isolated firmware-only workspace
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          set -euo pipefail
          ESP_IDF_IMAGE="$(python scripts/esp_idf_build_image.py --reference)"
          BUILD_ROOT="$RUNNER_TEMP/m5auth-release-build"
          python scripts/ci_esp_idf_isolated_build.py \
            --source-root "$GITHUB_WORKSPACE" \
            --work-root "$BUILD_ROOT" \
            --image-reference "$ESP_IDF_IMAGE"
          git diff --exit-code
          python scripts/ci_firmware_handoff.py create-build \
            --build-dir "$BUILD_ROOT/firmware/build" \
            --isolated-firmware-dir "$BUILD_ROOT/firmware" \
            --artifact-dir "$RUNNER_TEMP/m5auth-build-handoff" \
            --source-commit "$SOURCE_SHA"
      - name: Upload bounded raw build handoff
        id: upload-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5auth-build-${{ needs.authorize.outputs.source-sha }}
          path: ${{ runner.temp }}/m5auth-build-handoff
          if-no-files-found: error
          retention-days: 1

  verify:
    name: verify-firmware-unprivileged
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      checksums-sha256: ${{ steps.verify-package.outputs.checksums-sha256 }}
    steps:
      - name: Checkout authoritative authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.source-sha }}
      - name: Require production release profile
        run: python scripts/validate_release.py --require-production
      - name: Verify immutable ESP-IDF build image contract
        run: python -m unittest tests/esp_idf_image_pin_contract_test.py
      - name: Verify CI supply-chain privilege and workspace boundaries
        run: python -m unittest tests/ci_supply_chain_boundary_test.py
      - name: Download raw build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m5auth-build-${{ needs.authorize.outputs.source-sha }}
          path: ${{ runner.temp }}/m5auth-build-handoff
      - name: Independently verify raw build provenance
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          python scripts/ci_firmware_handoff.py verify-build \
            --artifact-dir "$RUNNER_TEMP/m5auth-build-handoff" \
            --source-commit "$SOURCE_SHA" \
            --expected-lock firmware/dependencies.lock
      - name: Verify final firmware security surface
        run: python scripts/verify_firmware_image.py "$RUNNER_TEMP/m5auth-build-handoff/m5authenticator-merged.bin"
      - name: Package independently verified firmware
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          python scripts/package_firmware.py \
            --merged-binary "$RUNNER_TEMP/m5auth-build-handoff/m5authenticator-merged.bin" \
            --bootloader-binary "$RUNNER_TEMP/m5auth-build-handoff/bootloader.bin" \
            --partition-table-binary "$RUNNER_TEMP/m5auth-build-handoff/partition-table.bin" \
            --app-binary "$RUNNER_TEMP/m5auth-build-handoff/m5authenticator.bin" \
            --output-dir "$RUNNER_TEMP/m5auth-release" \
            --build-commit "$SOURCE_SHA" \
            --exact-release \
            --require-production
          git diff --exit-code
      - name: Verify final package provenance and checksums
        id: verify-package
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          set -euo pipefail
          CHECKSUMS_SHA256="$(python scripts/ci_firmware_handoff.py verify-release-package \
            --package-dir "$RUNNER_TEMP/m5auth-release" \
            --build-provenance "$RUNNER_TEMP/m5auth-build-handoff/build-provenance.json" \
            --source-commit "$SOURCE_SHA")"
          echo "checksums-sha256=$CHECKSUMS_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload bounded verified release handoff
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5auth-release-${{ needs.authorize.outputs.source-sha }}
          path: ${{ runner.temp }}/m5auth-release
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-verified-release-assets
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout authoritative authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.source-sha }}
      - name: Download independently verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/m5auth-release
          merge-multiple: true
      - name: Reconfirm exact verified asset bytes before attestation
        shell: bash
        env:
          EXPECTED_SHA256SUMS: ${{ needs.verify.outputs.checksums-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m5auth-release"
          ACTUAL_SHA256SUMS="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256SUMS" != "$EXPECTED_SHA256SUMS" ]; then
            echo "verified SHA256SUMS identity changed before attestation"
            exit 1
          fi
          sha256sum -c SHA256SUMS
      - name: Generate M5Authenticator signed-provenance predicate
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python scripts/release_attestation.py \
            --package-dir "$RUNNER_TEMP/m5auth-release" \
            --source-commit "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/m5auth-release-provenance.json"
      - name: Attest standard GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/m5auth-release/*
      - name: Attest M5Authenticator release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/m5auth-release/*
          predicate-type: https://miso-develop.github.io/m5authenticator/attestations/release-provenance/v1
          predicate-path: ${{ runner.temp }}/m5auth-release-provenance.json

  publish:
    name: publish-verified-release
    needs: [authorize, verify, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download independently verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/m5auth-release
          merge-multiple: true
      - name: Confirm publish bytes match verification and attestation input
        shell: bash
        env:
          EXPECTED_SHA256SUMS: ${{ needs.verify.outputs.checksums-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m5auth-release"
          ACTUAL_SHA256SUMS="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256SUMS" != "$EXPECTED_SHA256SUMS" ]; then
            echo "verified SHA256SUMS identity changed across artifact handoff"
            exit 1
          fi
          sha256sum -c SHA256SUMS
      - name: Publish exactly the verified and attested GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ needs.authorize.outputs.requested-tag }}
        run: |
          set -euo pipefail
          gh release create "$REQUESTED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP"/m5auth-release/m5authenticator-v*-m5sticks3.bin \
            "$RUNNER_TEMP"/m5auth-release/m5authenticator-v*-m5sticks3-update-*.bin \
            "$RUNNER_TEMP"/m5auth-release/factory-manifest.json \
            "$RUNNER_TEMP"/m5auth-release/update-manifest.json \
            "$RUNNER_TEMP"/m5auth-release/factory-manifest-*.json \
            "$RUNNER_TEMP"/m5auth-release/update-manifest-*.json \
            "$RUNNER_TEMP"/m5auth-release/firmware-target.json \
            "$RUNNER_TEMP"/m5auth-release/release-metadata.json \
            "$RUNNER_TEMP"/m5auth-release/SHA256SUMS \
            --verify-tag \
            --title "M5Authenticator $REQUESTED_TAG" \
            --generate-notes

  cleanup:
    name: cleanup-transient-release-artifacts
    if: always()
    needs: [build, verify, attest, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete transient build and release handoffs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          RELEASE_ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
        run: |
          for artifact_id in "$BUILD_ARTIFACT_ID" "$RELEASE_ARTIFACT_ID"; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done

name: Authorized Release

on:
  repository_dispatch:
    types:
      - publish_semver_release

permissions:
  contents: read

jobs:
  authorize:
    name: authorize-protected-main-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      statuses: read
    outputs:
      requested-tag: ${{ steps.authorize.outputs.requested-tag }}
      source-sha: ${{ steps.authorize.outputs.source-sha }}
    steps:
      - name: Checkout default-branch release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require production release profile
        run: python scripts/validate_release.py --require-production
      - name: Authorize dispatch request, exact protected main, tag, and required checks
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail

          FIRMWARE_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('firmware/release-profile.json').read_text(encoding='utf-8'))['firmware_version'])
          PY
          )"

          if ! [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Requested release tag must use exact vX.Y.Z syntax"
            exit 1
          fi
          if [ "$REQUESTED_TAG" != "v$FIRMWARE_VERSION" ]; then
            echo "Requested tag $REQUESTED_TAG does not match release profile v$FIRMWARE_VERSION"
            exit 1
          fi

          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "Default-branch workflow source $GITHUB_SHA is not exact current main $MAIN_SHA"
            exit 1
          fi

          git fetch --force --no-tags origin \\
            "refs/tags/$REQUESTED_TAG:refs/tags/$REQUESTED_TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"

          gh api \\
            -H "Accept: application/vnd.github+json" \\
            -H "X-GitHub-Api-Version: 2026-03-10" \\
            "/repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" \\
            > "$RUNNER_TEMP/main-rules.json"
          gh api \\
            -H "Accept: application/vnd.github+json" \\
            -H "X-GitHub-Api-Version: 2026-03-10" \\
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100" \\
            > "$RUNNER_TEMP/check-runs.json"
          gh api \\
            -H "Accept: application/vnd.github+json" \\
            -H "X-GitHub-Api-Version: 2026-03-10" \\
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \\
            > "$RUNNER_TEMP/statuses.json"

          AUTHORIZED_TAG="$(python scripts/release_authorization.py \\
            --source-sha "$GITHUB_SHA" \\
            --main-sha "$MAIN_SHA" \\
            --requested-tag "$REQUESTED_TAG" \\
            --firmware-version "$FIRMWARE_VERSION" \\
            --tag-sha "$TAG_SHA" \\
            --main-rules "$RUNNER_TEMP/main-rules.json" \\
            --check-runs "$RUNNER_TEMP/check-runs.json" \\
            --statuses "$RUNNER_TEMP/statuses.json")"

          if [ "$AUTHORIZED_TAG" != "$REQUESTED_TAG" ]; then
            echo "Authorized release tag output mismatch"
            exit 1
          fi

          echo "requested-tag=$AUTHORIZED_TAG" >> "$GITHUB_OUTPUT"
          echo "source-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: build-firmware-unprivileged
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}
    steps:
      - name: Checkout authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.source-sha }}
      - name: Require production release profile
        run: python scripts/validate_release.py --require-production
      - name: Verify immutable ESP-IDF build image contract
        run: python -m unittest tests/esp_idf_image_pin_contract_test.py
      - name: Verify CI supply-chain privilege and workspace boundaries
        run: python -m unittest tests/ci_supply_chain_boundary_test.py
      - name: Build in isolated firmware-only workspace
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          set -euo pipefail
          ESP_IDF_IMAGE="$(python scripts/esp_idf_build_image.py --reference)"
          BUILD_ROOT="$RUNNER_TEMP/m5auth-release-build"
          python scripts/ci_esp_idf_isolated_build.py \\
            --source-root "$GITHUB_WORKSPACE" \\
            --work-root "$BUILD_ROOT" \\
            --image-reference "$ESP_IDF_IMAGE"
          git diff --exit-code
          python scripts/ci_firmware_handoff.py create-build \\
            --build-dir "$BUILD_ROOT/firmware/build" \\
            --isolated-firmware-dir "$BUILD_ROOT/firmware" \\
            --artifact-dir "$RUNNER_TEMP/m5auth-build-handoff" \\
            --source-commit "$SOURCE_SHA"
      - name: Upload bounded raw build handoff
        id: upload-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5auth-build-${{ needs.authorize.outputs.source-sha }}
          path: ${{ runner.temp }}/m5auth-build-handoff
          if-no-files-found: error
          retention-days: 1

  verify:
    name: verify-firmware-unprivileged
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      checksums-sha256: ${{ steps.verify-package.outputs.checksums-sha256 }}
    steps:
      - name: Checkout authoritative authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.source-sha }}
      - name: Require production release profile
        run: python scripts/validate_release.py --require-production
      - name: Verify immutable ESP-IDF build image contract
        run: python -m unittest tests/esp_idf_image_pin_contract_test.py
      - name: Verify CI supply-chain privilege and workspace boundaries
        run: python -m unittest tests/ci_supply_chain_boundary_test.py
      - name: Download raw build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: m5auth-build-${{ needs.authorize.outputs.source-sha }}
          path: ${{ runner.temp }}/m5auth-build-handoff
      - name: Independently verify raw build provenance
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          python scripts/ci_firmware_handoff.py verify-build \\
            --artifact-dir "$RUNNER_TEMP/m5auth-build-handoff" \\
            --source-commit "$SOURCE_SHA" \\
            --expected-lock firmware/dependencies.lock
      - name: Verify final firmware security surface
        run: python scripts/verify_firmware_image.py "$RUNNER_TEMP/m5auth-build-handoff/m5authenticator-merged.bin"
      - name: Package independently verified firmware
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          python scripts/package_firmware.py \\
            --merged-binary "$RUNNER_TEMP/m5auth-build-handoff/m5authenticator-merged.bin" \\
            --bootloader-binary "$RUNNER_TEMP/m5auth-build-handoff/bootloader.bin" \\
            --partition-table-binary "$RUNNER_TEMP/m5auth-build-handoff/partition-table.bin" \\
            --app-binary "$RUNNER_TEMP/m5auth-build-handoff/m5authenticator.bin" \\
            --output-dir "$RUNNER_TEMP/m5auth-release" \\
            --build-commit "$SOURCE_SHA" \\
            --exact-release \\
            --require-production
          git diff --exit-code
      - name: Verify final package provenance and checksums
        id: verify-package
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
        run: |
          set -euo pipefail
          CHECKSUMS_SHA256="$(python scripts/ci_firmware_handoff.py verify-release-package \\
            --package-dir "$RUNNER_TEMP/m5auth-release" \\
            --build-provenance "$RUNNER_TEMP/m5auth-build-handoff/build-provenance.json" \\
            --source-commit "$SOURCE_SHA")"
          echo "checksums-sha256=$CHECKSUMS_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload bounded verified release handoff
        id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5auth-release-${{ needs.authorize.outputs.source-sha }}
          path: ${{ runner.temp }}/m5auth-release
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-verified-release-assets
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout authoritative authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.source-sha }}
      - name: Download independently verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/m5auth-release
          merge-multiple: true
      - name: Reconfirm exact verified asset bytes before attestation
        shell: bash
        env:
          EXPECTED_SHA256SUMS: ${{ needs.verify.outputs.checksums-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m5auth-release"
          ACTUAL_SHA256SUMS="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256SUMS" != "$EXPECTED_SHA256SUMS" ]; then
            echo "verified SHA256SUMS identity changed before attestation"
            exit 1
          fi
          sha256sum -c SHA256SUMS
      - name: Generate M5Authenticator signed-provenance predicate
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python scripts/release_attestation.py \\
            --package-dir "$RUNNER_TEMP/m5auth-release" \\
            --source-commit "$SOURCE_SHA" \\
            --repository "$GITHUB_REPOSITORY" \\
            --workflow-ref "$WORKFLOW_REF" \\
            --workflow-sha "$WORKFLOW_SHA" \\
            --run-id "$GITHUB_RUN_ID" \\
            --run-attempt "$GITHUB_RUN_ATTEMPT" \\
            --output "$RUNNER_TEMP/m5auth-release-provenance.json"
      - name: Attest standard GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/m5auth-release/*
      - name: Attest M5Authenticator release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/m5auth-release/*
          predicate-type: https://miso-develop.github.io/m5authenticator/attestations/release-provenance/v1
          predicate-path: ${{ runner.temp }}/m5auth-release-provenance.json

  publish:
    name: publish-verified-release
    needs: [authorize, verify, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download independently verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/m5auth-release
          merge-multiple: true
      - name: Confirm publish bytes match verification and attestation input
        shell: bash
        env:
          EXPECTED_SHA256SUMS: ${{ needs.verify.outputs.checksums-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m5auth-release"
          ACTUAL_SHA256SUMS="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA256SUMS" != "$EXPECTED_SHA256SUMS" ]; then
            echo "verified SHA256SUMS identity changed across artifact handoff"
            exit 1
          fi
          sha256sum -c SHA256SUMS
      - name: Publish exactly the verified and attested GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ needs.authorize.outputs.requested-tag }}
        run: |
          set -euo pipefail
          gh release create "$REQUESTED_TAG" \\
            --repo "$GITHUB_REPOSITORY" \\
            "$RUNNER_TEMP"/m5auth-release/m5authenticator-v*-m5sticks3.bin \\
            "$RUNNER_TEMP"/m5auth-release/m5authenticator-v*-m5sticks3-update-*.bin \\
            "$RUNNER_TEMP"/m5auth-release/factory-manifest.json \\
            "$RUNNER_TEMP"/m5auth-release/update-manifest.json \\
            "$RUNNER_TEMP"/m5auth-release/factory-manifest-*.json \\
            "$RUNNER_TEMP"/m5auth-release/update-manifest-*.json \\
            "$RUNNER_TEMP"/m5auth-release/firmware-target.json \\
            "$RUNNER_TEMP"/m5auth-release/release-metadata.json \\
            "$RUNNER_TEMP"/m5auth-release/SHA256SUMS \\
            --verify-tag \\
            --title "M5Authenticator $REQUESTED_TAG" \\
            --generate-notes

  cleanup:
    name: cleanup-transient-release-artifacts
    if: always()
    needs: [build, verify, attest, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete transient build and release handoffs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          RELEASE_ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
        run: |
          for artifact_id in "$BUILD_ARTIFACT_ID" "$RELEASE_ARTIFACT_ID"; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done

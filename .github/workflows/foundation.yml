name: Foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install exact dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Web App
        working-directory: web
        run: npm test
      - name: Build Web App
        working-directory: web
        run: npm run build
      - name: Verify Web lockfile is unchanged
        run: git diff --exit-code -- web/package-lock.json

  firmware:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test storage state codec
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror
          -Ifirmware/components/m5auth_storage/include
          -Ifirmware/components/m5auth_storage
          firmware/components/m5auth_storage/state.cpp
          tests/storage_state_test.cpp
          -o /tmp/m5auth-storage-state-test
          && /tmp/m5auth-storage-state-test
      - name: Test trusted time state
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -pthread
          -Ifirmware/components/m5auth_time/include
          firmware/components/m5auth_time/trusted_time.cpp
          tests/trusted_time_test.cpp
          -o /tmp/m5auth-trusted-time-test
          && /tmp/m5auth-trusted-time-test
      - name: Test TOTP core with RFC vectors
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror
          -Ifirmware/components/m5auth_totp/include
          firmware/components/m5auth_totp/totp_core.cpp
          tests/totp_core_test.cpp
          -o /tmp/m5auth-totp-core-test
          && /tmp/m5auth-totp-core-test
      - name: Test StickS3 UI model
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror
          -Ifirmware/components/m5auth_device_sticks3/include
          -Ifirmware/components/m5auth_storage/include
          firmware/components/m5auth_device_sticks3/ui_model.cpp
          tests/device_ui_model_test.cpp
          -o /tmp/m5auth-device-ui-model-test
          && /tmp/m5auth-device-ui-model-test
      - name: Test StickS3 runtime contract
        run: python -m unittest tests/sticks3_runtime_contract_test.py
      - name: Validate release profile and package rules
        run: |
          python scripts/validate_release.py
          python -m unittest tests/release_package_test.py
      - name: Build and merge with ESP-IDF 5.5.5
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/project"
          -w /project/firmware
          espressif/idf:v5.5.5
          bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build && idf.py merge-bin -o m5authenticator-merged.bin -f raw'
      - name: Validate the CI-built distribution package
        run: >-
          python scripts/package_firmware.py
          --merged-binary firmware/build/m5authenticator-merged.bin
          --output-dir /tmp/m5auth-release
          --build-commit "$GITHUB_SHA"
      - name: Verify ESP-IDF dependency lockfile is unchanged
        run: git diff --exit-code -- firmware/dependencies.lock
